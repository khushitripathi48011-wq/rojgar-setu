services:
  - type: web
    name: rojgar-setu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CAREERTWIN_SECRET_KEY
        generateValue: true
      - key: CAREERTWIN_HTTPS
        value: "1"
